name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python and CUDA compilation (CPU only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: g++-13
      NVCC: /usr/local/cuda-12.9/bin/nvcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python dependencies
        run: |
          python3 -m pip install uv==0.7.9
          uv sync --locked --extra visualize

      - name: Check formatting, lint and types
        run: |
          uv run --frozen ruff format --check src tests bench
          uv run --frozen ruff check src tests bench
          uv run --frozen mypy

      - name: Install CUDA compiler
        run: |
          curl --fail --location --retry 3 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            --output "$RUNNER_TEMP/cuda-keyring.deb"
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cuda-nvcc-12-9 g++-13
          "$NVCC" --version
          "$CXX" --version

      - name: Test CPU arithmetic, code generation and CUDA compilation
        run: uv run --frozen pytest --run-cuda

      - name: Build distribution
        run: uv build
