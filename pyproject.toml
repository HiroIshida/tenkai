[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tenkai"
version = "0.1.0"
description = "Generate robot-specialized CUDA kernels from URDF models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy>=2",
    "tyro>=1.0.16",
]

[project.scripts]
tenkai-generate = "tenkai.cli:cli"

[project.optional-dependencies]
bench = ["plainmp>=0.3.6,<0.4"]
visualize = [
    "robot-descriptions>=3.3,<4",
    "viser[urdf]>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "mypy>=1.13",
    "types-PyYAML>=6",
    "ruff>=0.11",
    "clang-format==23.1.5",
]
docs = [
    "mkdocs>=1.6,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenkai"]

[tool.hatch.build.targets.wheel.force-include]
"licenses" = "tenkai/licenses"

[tool.hatch.build.targets.sdist]
include = ["src/tenkai", "tests", "assets", "bench", "example", "licenses", "pyproject.toml", "uv.lock", ".python-version", "README.md", "format.sh"]
exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu_compile: requires the selected CUDA or HIP compiler",
    "gpu: requires a GPU supported by the selected backend",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/tenkai", "bench", "example"]
exclude = ["^bench/artifacts/"]
strict = true

# These dependencies do not distribute py.typed markers.
[[tool.mypy.overrides]]
module = ["plainmp", "plainmp.*", "robot_descriptions", "robot_descriptions.*"]
ignore_missing_imports = true
