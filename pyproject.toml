[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tenkai"
version = "0.1.0"
description = "Generate robot-specialized CUDA kernels from URDF models"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0,<7", "numpy>=2"]

[project.scripts]
tenkai-generate = "tenkai.cli:main"

[project.optional-dependencies]
bench = ["plainmp>=0.3.6,<0.4"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "mypy>=1.13",
    "types-PyYAML>=6",
    "ruff>=0.11",
    "clang-format==23.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenkai"]

[tool.hatch.build.targets.wheel.force-include]
"licenses" = "tenkai/licenses"

[tool.hatch.build.targets.sdist]
include = ["src/tenkai", "tests", "assets", "bench", "licenses", "pyproject.toml", "uv.lock", ".python-version", "README.md", "format.sh"]
exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu_compile: requires the selected CUDA or HIP compiler",
    "gpu: requires a GPU supported by the selected backend",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/tenkai", "bench"]
strict = true

# plainmp does not distribute a py.typed marker.
[[tool.mypy.overrides]]
module = ["plainmp", "plainmp.*"]
ignore_missing_imports = true
