[package]
name = "rkern"
version = "0.1.0"
edition = "2024"

[[example]]
name = "bench_generate"
path = "bench/generate.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
urdf-rs = "0.10.0"

[dev-dependencies]
serde_json = "1.0.152"
